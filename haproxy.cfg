global
    maxconn 10000
    nbthread 2

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    option http-server-close
    option forwardfor

frontend http_front
    bind *:80
    default_backend api_back

backend api_back
    balance roundrobin
    option httpchk GET /ready
    server api1 api1:8080 check inter 5s fall 3 rise 2
    server api2 api2:8080 check inter 5s fall 3 rise 2
